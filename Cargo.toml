[package]
name = "gh_package_finder"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "=2.9.7", default-features = false, features = ["json", "native-tls"] }
native-tls = "=0.2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
toml = "0.8"
