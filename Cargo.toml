[package]
name = "gh_package_finder"
version = "0.1.0"
edition = "2021"

[dependencies]
# TLS en Rust pur (rustls) : aucune dépendance à OpenSSL/LibreSSL du système.
# "native-certs" utilise le magasin de certificats de l'OS (Keychain macOS, /etc/ssl Linux).
ureq = { version = "2.9", default-features = false, features = ["json", "tls", "native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
toml = "0.8"
